[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lore-weave-ai"
version = "0.1.0"
description = "Long-form AI fiction studio: story bible, plot architect, style infusion and coherent 50-200+ page manuscripts."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
local = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
loreweave = "loreweave.cli:main"

[tool.setuptools.packages.find]
include = ["loreweave*"]

[tool.setuptools.package-data]
loreweave = ["web/*"]
